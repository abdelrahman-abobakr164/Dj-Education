<section class="newsletter_area section-padding">
    <div class="container">
        <div class="row text-center">			
            <div class="col-lg-6 offset-lg-3 col-sm-12 col-xs-12">
                <div class="subs_form">
                    <h3>Subscribe to our newsletter, We don't make any spam.</h3>
                    <form method="POST" action='{% url "newsletter" %}' class="home_subs">
                        {% csrf_token %}
                        <input type="email" name='email' required class="subscribe__input" placeholder="Enter your Email Address">
                        <button type="submit" class="subscribe__btn">Subscribe</button>
                    </form>
                </div>
            </div><!-- END COL -->
        </div><!-- END ROW -->	
    </div><!--- END CONTAINER -->	
</section>
