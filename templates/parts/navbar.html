{% load static %}
<div id="navigation" class="navbar-light bg-faded site-navigation">
    <div class="container">
        <div class="row">
            <div class="col-20 align-self-center">
                <div class="site-logo">
                    <a href="{% url 'index' %}"><img src="{% static 'assets/images/all-img/logo.png' %}" alt=""></a>          				
                </div>
            </div>
            
            <div class="col-60 d-flex mt-3">
                <nav id="main-menu">
                    <ul>
                        <li><a href="{% url 'index' %}"><h5>Home</h5></a></li>
                        <li><a href="{% url 'courses' %}"><h5>Courses</h5></a></li>
                        <li><a href="{% url 'events' %}"><h5>Events</h5></a></li>
                        <li><a href="{% url 'blogs' %}"><h5>Blogs</h5></a></li>
                        <li><a href="{% url 'contact' %}"><h5>Contact</h5></a></li>
                    </ul>
                </nav>
            </div>
            
            <div class="col-30 d-none d-xl-block text-end align-self-center">
                {% if request.user.is_authenticated and request.user.is_mentor == 'No' %}
                    <div class="home_lc">
                        <a href="{% url 'my-saved-blogs' %}" target="_blank" title='Saved Blogs' class="hlc">
                            <i class="fa-regular fa-bookmark"></i>
                        </a>
                        <a href="{% url 'my-courses' %}" target="_blank" title='Courses' class="hlc">
                            <i class="fa fa-book-bookmark"></i>
                        </a>
                        <a href="{% url 'my-events' %}" target="_blank" title='Events' class="hlc">
                            <i class="fa fa-table"></i>
                        </a>
                    </div>
                {% elif not request.user.is_authenticated %}
                    <div class="call_to_action">
                        <a class="btn_two" href="register.html">Login / Register</a>
                    </div>
                {% else %}
                    <div class="home_lc">
                        <a href="{% url 'my-saved-blogs' %}" target="_blank" title='Saved Blogs' class="hlc">
                            <i class="fa-regular fa-bookmark"></i>
                        </a>
                        <a href="{% url 'profile' request.user.slug %}" target="_blank" title='Account' class="hlc">
                            <i class="fa-solid fa-user-gear"></i>
                        </a>        
                    </div>
                {% endif %}
            </div>
            
            <ul class="mobile_menu">						
                <li><a href="{% url 'index' %}">Home</a></li>	
                <li><a href="{% url 'courses' %}">Courses</a></li>
                <li><a href="{% url 'events' %}">Events</a></li>
                <li><a href="{% url 'blogs' %}">Blogs</a></li>
                <li><a href="{% url 'contact' %}">Contact</a></li>
            </ul>			
        </div>
    </div>
</div>
